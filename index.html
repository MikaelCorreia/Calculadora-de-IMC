<!DOCTYPE html>
<html lang="pt-BR">

    <!-- Configurações da página - Início -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>

  <!-- Arquivo de estilo (CSS) -->
  <link rel="stylesheet" href="style.css">

</head>
    <!-- Configurações da página - Fim -->


    
    <!-- BODY (Conteúdo) - Início -->
<body>

  <div class="container">
    <h1>Calculadora de IMC</h1>


        <!-- ===== Entradas ===== -->

    <!-- Campo de entrada do peso -->
    <label for="peso">Digite seu Peso (kg):</label>
    <input type="number" id="peso" min="1" step="0.1" oninput="validarCampos()">

    <!-- Campo de entrada da altura -->
    <label for="altura">Digite a sua Altura (m):</label>
    <input type="number" id="altura" min="0.5" max="2.5" step="0.01" oninput="validarCampos()">


        <!-- ===== Ações ===== -->

    <!-- Botão principal para Calcular o IMC -->
    <button id="btnCalcular" onclick="calcularIMC()" disabled>Calcular</button>
    <button class="btn-limpar" onclick="limparCampos()">Limpar</button>

    <!-- Retorno exibido ao usuário -->
    <p id="resultado"></p>
  </div>

  <!-- Arquivo de script (JavaScript) -->
  <script src="script.js"></script>

</body>
    <!-- BODY (Conteúdo) - Fim -->

</html>
